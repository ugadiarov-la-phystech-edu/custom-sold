# Lint and format on commit with the mof-text env's ruff (setup: pip install pre-commit && pre-commit install).
# mypy and the tests run in scripts/check.sh.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
