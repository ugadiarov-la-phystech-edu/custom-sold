# @package _global_
defaults:
  - environment@model.env: reach_red  # e.g. environment@model.env=push_red
  - hydra: default
  - logger: sold
  - _self_
  - preset: null  # Run setup from configs/preset/, e.g. preset=pick_red_finetune.

checkpoint: ""
experiment: "my_experiment"
seed: 42
device: auto  # "cuda", "cpu" or "auto" (the GPU when there is one).
float32_matmul_precision: high  # TF32 matmuls on GPUs; "highest" for full float32.
num_envs: 1  # Environments stepped in parallel, each in its own process if more than one (sold.envs.vector).
fused_optimizers: null  # Fused Adam kernels: null uses them on GPUs.
compile:  # torch.compile of the training stages (SOLDModule.STAGES); the first update compiles for several minutes.
  # "reduce-overhead": compiled and replayed as CUDA graphs, the fastest on a GPU; "default": compiled without CUDA
  # graphs; null: no compilation, plain (eager) PyTorch, e.g. on a CPU, where compiling only costs time, or to debug.
  mode: reduce-overhead
  stages: null  # A list of stages to compile; null compiles all of them.

model:
  _target_: sold.train_sold.SOLDModule

  max_steps: 10_000_000  # Maximum number of environment steps to train for.
  num_seed: 250  # Start training after 'train_after' random steps.
  update_freq: 25  # Update the models every 'update_freq' steps.
  num_updates: 2  # Number of updates to perform whenever the models are updated.
  eval_freq: 1500  # Evaluate the models every 'eval_freq' steps.
  num_eval_episodes: 5  # Number of episodes to collect during evaluation.
  batch_size: 8  # Batch size for training.
  buffer_capacity: 1250000  # Maximum number of time-steps to store in the replay buffer.
  profile: True  # Log section durations as timing/*_ms.
  save_replay_buffer: True  # Whether to save the full replay buffer for the latest checkpoint to enable resuming of training.

  optimization:  # Adam learning rate and gradient-norm clip per model.
    dynamics: {learning_rate: 0.0001, grad_clip: 3.0}
    reward: {learning_rate: 0.0001, grad_clip: 10.0}
    actor: {learning_rate: 0.00003, grad_clip: 10.0}
    critic: {learning_rate: 0.00003, grad_clip: 10.0}
    autoencoder: {learning_rate: 0.0001, grad_clip: 0.05}  # Used with finetune_autoencoder.
  actor_entropy_loss_weight: 0.0003
  actor_gradients: "dynamics"  # Use "dynamics" or "reinforce" gradients for the actor.
  finetune_autoencoder: False  # Whether to finetune the autoencoder model.

  num_context: 3  # exact or [min, max] number of context frames given to the model during dynamics learning and latent imagination.
  imagination_horizon: 15  # Number of frames to predict in imagination.
  start_imagination_from_every: False  # Whether to start imagination from possible frame in the sequences or only a single one.

  return_lambda: 0.95  # Lambda used to compute bootstrapped λ-returns.
  discount_factor: 0.96  # Discount factor used to compute returns.
  critic_ema_decay: 0.98  # Exponential moving average decay for the critic target network.
  critic_regularization_weight: 0.1  # Weight of the critic's regularization towards the target critic.

  autoencoder:
    _target_: sold.train_autoencoder.load_autoencoder
    checkpoint_path: ../checkpoints/autoencoder/savi/reach_red/latest.ckpt

  dynamics_predictor:
    _target_: sold.modeling.sold.dynamics.make_ocvp_seq_dynamics_model
    _partial_: True
    token_dim: 256
    hidden_dim: 512
    num_layers: 4
    num_heads: 8
    residual: True
    teacher_forcing: False

  actor:
    _target_: sold.modeling.sold.prediction.GaussianPredictor
    _partial_: True
    token_dim: 256
    num_heads: 8
    num_layers: 3
    hidden_dim: 512
    num_mlp_layers: 1
    min_std: 0.1  # Bounds of the action std.
    max_std: 1.0
    init_std: 2.0  # Offset of the std's sigmoid (larger starts closer to max_std).

  critic:
    _target_: sold.modeling.sold.prediction.TwoHotPredictor
    _partial_: True
    token_dim: 256
    num_heads: 8
    num_layers: 3
    hidden_dim: 512
    num_mlp_layers: 1
    num_bins: 255  # Exponentially spaced two-hot bins.

  reward_predictor:
    _target_: sold.modeling.sold.prediction.TwoHotPredictor
    _partial_: True
    token_dim: 256
    num_heads: 8
    num_layers: 3
    hidden_dim: 512
    num_mlp_layers: 1
    num_bins: 255  # Exponentially spaced two-hot bins.
