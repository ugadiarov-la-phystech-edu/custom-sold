[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sold"
version = "0.1.0"
description = "SOLD: Slot-Attention for Object-centric Latent Dynamics"
requires-python = ">=3.10"
# Dependencies are pinned and installed by update_mof_text_env.sh.

[tool.setuptools.packages.find]
include = ["sold*"]

# Test configuration only; SOLD itself is run from the sold/ folder (see README).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # The sold package and tests, without installing.
addopts = "-ra --strict-markers"
timeout = 600
markers = [
    "mujoco: needs a working mujoco-py and multi_object_fetch with rendering",
    "slow: runs a complete (tiny) training or evaluation script",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:.*is currently marked under review.*",
    "ignore:.*does not have many workers.*",
    "ignore:.*pin_memory.*",
    "ignore:.*Checkpoint directory.*exists and is not empty.*",
    "ignore:.*GPU available but not used.*",
    "ignore:.*The number of training batches.*",
    "ignore:.*You called `self.log.*",
    "ignore:.*To copy construct from a tensor.*",
    "ignore:.*is an instance of `nn.Module` and is already saved during checkpointing.*",
    "ignore:.*video decoding and encoding capabilities of torchvision are deprecated.*",
    "ignore:.*Box bound precision lowered.*",
    "ignore:.*pkg_resources is deprecated.*",
    "ignore:.*Defaults list is missing `_self_`.*",
    "ignore:.*The version_base parameter is not specified.*",
]

# 100% line coverage is enforced. Branch coverage would count towards the same total, so it is off here;
# see it with: pytest --cov --cov-branch --cov-fail-under=0
[tool.coverage.run]
source = ["sold"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Defaults (pyflakes, pycodestyle errors), line length, warnings, isort, bugbear, pyupgrade.
select = ["E4", "E7", "E9", "E501", "F", "W", "I", "B", "UP"]
# zip(strict=True) would turn silent length mismatches into errors, a behavior change.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Re-exports.

[tool.ruff.lint.isort]
# One alphabetical block, like the original code.
no-sections = true
force-sort-within-sections = true

[tool.mypy]
# Type-checked: modules free of Lightning, Hydra and environment state; imports are followed silently.
python_version = "3.11"
files = [
    "sold/rl",
    "sold/modeling/distributions.py",
    "sold/modeling/autoencoder/losses.py",
    "sold/utils/episode_runner.py",
    "sold/utils/schedulers.py",
]
follow_imports = "silent"
ignore_missing_imports = true  # gym 0.17, hydra plugins and others are untyped.
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

